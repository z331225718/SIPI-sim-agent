classes:
- product_candidate
- migration_only
- oracle_only
- quarantine
- generated
rules:
- id: product-governance
  include:
  - LICENSE
  - LICENSE-SCOPE.md
  - README.md
  - SPEC.md
  - PLAN.md
  - product-boundary.v1.yaml
  - docs/adr/ADR-011-native-mit-rust-product-boundary.md
  class: product_candidate
  license: MIT
  provenance: project_authored
  distribution: product
  owner: sipi-release-gate
  reason: v0.2 product charter and MIT boundary policy
- id: migration-metadata
  include:
  - .gitignore
  - pyproject.toml
  - uv.lock
  - toolchains.lock
  - dirty-disposition.v1.yaml
  - license-manifest.v1.yaml
  - license-manifest.v2.yaml
  - clean-room-register.v1.yaml
  - acceptance-profiles.v1.yaml
  - rust-candidate-source-map.v1.yaml
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: project_authored
  distribution: evidence
  owner: sipi-migration-owner
  reason: v0.1 tooling and source-license evidence remain outside product release
- id: github-migration
  include:
  - .github/**
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: project_authored
  distribution: evidence
  owner: sipi-migration-owner
  reason: current CI targets the legacy Python migration platform
- id: legacy-python-platform
  include:
  - apps/**
  - packages/**
  - schemas/**
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: project_authored
  distribution: non-distributed
  owner: sipi-migration-owner
  reason: Python platform behavior is migration/oracle evidence, not the Rust product
    runtime
- id: migration-engine-source
  include:
  - engines/**
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: external
  distribution: non-distributed
  owner: sipi-migration-owner
  reason: imported Agent-Spice source is not a promoted Rust product crate
- id: native-candidates
  include:
  - native/**
  class: quarantine
  license: LicenseRef-Provenance-Pending
  provenance: external
  distribution: non-distributed
  owner: sipi-clean-room-owner
  reason: Rust candidates require P0-09 source and clean-room audit before promotion
- id: external-examples
  include:
  - examples/**
  - fixtures/**
  class: oracle_only
  license: LicenseRef-Fixture-Provenance-Pending
  provenance: external
  distribution: non-distributed
  owner: sipi-acceptance-owner
  reason: examples and fixtures require per-profile license and provenance inventory
- id: historical-docs
  include:
  - docs/**
  exclude:
  - docs/adr/ADR-011-native-mit-rust-product-boundary.md
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: project_authored
  distribution: evidence
  owner: sipi-migration-owner
  reason: historical audits and migration documents are not release documentation
    yet
- id: migration-tools
  include:
  - tools/**
  - tests/**
  class: migration_only
  license: LicenseRef-See-License-Manifest
  provenance: project_authored
  distribution: evidence
  owner: sipi-migration-owner
  reason: existing verification tools exercise the Python migration platform
