contract:
  positional_arguments: [touchstone]
  public_options:
    - --output
    - --report
    - --html-report
    - --fitted-touchstone
    - --rfm
    - --rfm-wrapper
    - --report-top-rms
    - --log
    - --rms-target
    - --priority-band
    - --outside-band-weight
    - --passivity
    - --max-order
    - --min-order
    - --max-order-step
    - --quality-profile
    - --fail-on-quality
    - --allow-quality-warnings
    - --subckt-name
    - --tuning-profile
    - --pole-spacing
    - --fit-iterations
    - --hf-complex-pairs
    - --hf-pair-damping
    - --hf-pair-start-fraction
    - --passivity-max-iterations
    - --passivity-samples
    - --passivity-active-variables
  defaults:
    report_top_rms: 5
    outside_band_weight: 0.1
    passivity: check
    max_order: 100
    min_order: 1
    max_order_step: 8
    quality_profile: explore
    fail_on_quality: false
    allow_quality_warnings: false
    subckt_name: s_equivalent
    pole_spacing: log
    fit_iterations: 14
    hf_complex_pairs: 2
    hf_pair_damping: 0.03
    hf_pair_start_fraction: 0.68
    passivity_max_iterations: 3
    passivity_samples: 8
    passivity_active_variables: 3072
  target_selection:
    no_priority_band: full_band_rms_required
    priority_band_without_full_target: priority_band_only
    priority_band_with_full_target: priority_band_and_full_band
    full_band_gate_formula: not priority_bands or rms_target_is_present
  passivity_precedence:
    explicit_policy_conflicts_with_legacy_flags: true
    legacy_enforce_precedes_skip_check: true
    otherwise: check
  errors:
    - argparse_rejection
    - invalid_priority_band
    - missing_or_nonpositive_rms_target
    - invalid_order_or_order_step
    - invalid_report_top_rms
    - invalid_subcircuit_name
    - unsupported_pole_spacing
    - invalid_fit_or_passivity_budget
    - value_error
    - os_error
    - child_nonzero_exit
  artifact_defaults:
    output_when_omitted: <touchstone_stem>_fitted.sp
    report_when_output_omitted: <output_stem>_report.json
    html_report_when_output_omitted: <output_stem>_report.html
    report_when_output_explicit: fit_report.json_in_output_parent
    html_report_when_output_explicit: fit_report.html_in_output_parent
    fitted_touchstone: output_suffix_replaced_by_input_suffix
    rfm: output_suffix_replaced_by_rfm
    rfm_wrapper: <rfm_stem>_rfm_wrapper.sp
    log: <touchstone_stem>.log_in_report_parent
  reachable_branches:
    - argument_parser_rejection
    - priority_band_or_full_band_target_selection
    - explicit_or_legacy_passivity_resolution
    - adaptive_order_search
    - native_fit
    - optional_passivity_check
    - optional_passivity_enforcement
    - optional_quality_gate_failure
    - target_not_met_failure
    - fitted_touchstone_export
    - rfm_export
    - rfm_wrapper_export
    - json_html_log_report_export
    - fit_success
    - fit_failure
