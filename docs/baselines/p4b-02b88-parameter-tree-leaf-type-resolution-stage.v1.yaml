  "purpose": "P4B-02 typed AMI parameter sub-slice: resolves the declared type of a single leaf by canonical dot-separated path (root.gain) inside an AmiParameterTreeV1 via resolve_parameter_tree_leaf_type_v1 in sipi-ami-text parameter_tree_leaf_type_resolution_v1.rs: returns the leaf declared type token (Float/Integer/Boolean/String/List) when the leaf is a well-formed typed form (exactly two value tokens whose first token is a known type token). This is the single-path query companion of 02b87 leaf type map extraction and the type-level companion of 02b30 leaf index resolution (which returns value tokens, not types). Fail-closed: an empty path yields EmptyPath; a path that matches no node yields MissingPath; a path that lands on a branch yields PathNotLeaf; a leaf that is not a typed form yields LeafNotTypedForm. Paths are trimmed and empty segments filtered, mirroring 02b30.",
