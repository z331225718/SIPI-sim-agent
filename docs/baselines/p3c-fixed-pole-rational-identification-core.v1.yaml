schema: sipi.p3c-fixed-pole-rational-identification-core.v1
status: product_owned_fixed_pole_residue_identification_specified_relocating_fit_and_executor_blocked
authority:
  actor: user
  decision_ref: user-confirmed-2026-08-12-p3c-rational-route-recommendation
  scope: selected_static_hdiff_fixed_pole_fit_only
input_boundary:
  source_type: selected_p3c_static_differential_transfer_v1
