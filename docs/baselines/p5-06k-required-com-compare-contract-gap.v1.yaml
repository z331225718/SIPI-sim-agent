required_compare_contract:
  input_identity:
    required_keys:
      - normalized_input_digest
      - channel_role_manifest_digest
      - parameter_set_digest
    status: missing_clean_replayable_binding
    observed_but_insufficient:
      - external_payload_OP_and_param_digests
      - observed_network_roles_and_target_frequency
    gap: >-
      Existing payload observations bind selected OP/param bytes, but do not
      provide an authorized, clean, replayable manifest that binds exact
      channel files, role manifest, parameter set, and normalized input to the
      required compare case.
  stage_observables:
    required_keys:
      - selected_channel_evidence
      - equalizer_selection_evidence
      - pdf_axes_and_density
    status: missing_compare_alignment_contract
    observed_but_insufficient:
      - network_role_and_frequency_summary
      - TXLE_and_DFE_tap_snapshots
      - PDF_related_scalar_checkpoint_names
    gap: >-
      The records expose bounded snapshots but do not define the exact stage
      identity, array axes, density representation, selection provenance, or
      per-stage comparison rule needed to align product and oracle outputs.
  metric_bundle:
    required:
      - id: com_db
        unit: dB
        comparison_level: scalar
        source_aliases: [COM_dB]
        status: alias_observed_value_observed_tolerance_missing
      - id: erl_db
        unit: dB
        comparison_level: scalar
        source_aliases: [ERL]
        status: alias_observed_value_observed_tolerance_missing
      - id: td_iln_db
        unit: dB
        comparison_level: scalar
        source_aliases: [TD_ILN]
        status: legacy_alias_only_value_and_tolerance_missing
    observed_external_surface:
      - COM_dB
      - CTLE_DC_gain_dB
      - ERL
      - ERL11
      - ERL22
      - FOM
      - ICN_mV
      - IL_dB_channel_only_at_Fnq
      - Peak_ISI_XTK_and_Noise_interference_at_BER_mV
      - VEC_dB
      - VEO_mV
      - fitted_IL_dB_at_Fnq
      - g_DC_HP
      - itick
    observed_c4_surface:
      ids: [COM_dB, ICN_mV, ERL]
      policy: sipi.p3c-03c.c4-profile.v1.com-icn-erl-1pct
      relative_tolerance: 0.01
      scope: c4_metric_profile_only
      cannot_substitute_for: [td_iln_db]
    gap: >-
      Required COM/ERL/TD-ILN is not the observed C4 COM_dB/ICN_mV/ERL
      surface. ICN_mV is not TD-ILN. The pinned source only exposes TD_ILN in
      the legacy output schema; current observed metric surfaces do not bind a
      TD_ILN value or a required td_iln_db tolerance.
  checkpoint_contract:
    observed_required_matrix_keys:
      - DFE_taps
      - TXLE_taps
      - itick
      - sgm_Ani__isi_xt_noise
      - sigma_N
      - tail_RSS
    observed_case_count: 2
    observed_case_checkpoint_digests: true
    source_helper_checkpoint_groups:
      top_level:
        - TXLE_taps
        - DFE_taps
        - floating_tap_locations
        - tail_RSS
        - sigma_N
        - sigma_bn
        - itick
        - sgm_Q
        - peak_clip
        - sigma_before_clip
        - P2ptopsigma_clip
        - sgm_Ani__isi_xt_noise
      param:
        - ndfe
        - N_bf
        - N_bg
        - N_bmax
        - N_tail_start
        - bmax
        - bmin
        - use_bmax
        - use_bmin
        - SNDR
        - B_float_RSS_MAX
        - P_qc
        - Q_budget_adj
        - kappa1
        - kappa2
      fom_result:
        - txffe
        - ctle
        - best_G_high_pass
        - DFE_taps
        - floating_tap_locations
        - best_bmax
        - best_bmin
        - tail_RSS
        - t_s
        - itick
        - sigma_N
        - FOM
      mlse:
        - Q_budget_adj
        - COM_from_matlab
        - delta_com
        - COM
        - DER_MLSE
        - DER_MLSE_trunc
    status: checkpoint_alignment_and_tolerance_missing
    gap: >-
      Checkpoint names and bounded values are observed, but the required
      contract lacks exact case/stage identity, array shape and axis semantics,
      units, sample/time index alignment, selection provenance, and
      per-checkpoint tolerances. A checkpoint digest alone cannot close those
      comparisons.
  alignment_policy:
    required_dimensions:
      - normalized_input_identity
      - case_index_and_case_order
      - channel_role_and_port_order
      - frequency_axis_and_target_frequency
      - equalizer_selection_identity
      - checkpoint_stage_identity_and_axes
      - metric_name_unit_and_scalar_semantics
      - nonfinite_value_policy
    observed_facts:
      case_order_check: repeated_runner_checks_case_count_and_order_only
      target_frequency_hz: 26560000000.0
      observed_network_roles: [THRU, FEXT1, NEXT1]
      observed_port_order: [1, 3, 2, 4]
      network_array_check_tolerances: {rtol: 1.0e-12, atol: 1.0e-14}
    status: missing
    gap: >-
      The source and records do not define a full product/oracle alignment
      policy for the required input, selected channel, equalizer, PDF,
      checkpoint arrays, and COM/ERL/TD-ILN scalar aliases.
  tolerance_policy:
    required_components:
      - final_metric_tolerance_per_required_metric
      - intermediate_checkpoint_tolerance_per_field_or_array
      - stage_observable_tolerance
      - normalized_input_tolerance_or_exact_digest_rule
    observed_non_acceptance_tolerances:
      - id: repeated_matlab_run_scalar_metrics
        value: 1.0e-12
        scope: runner_repeatability_only
      - id: network_raw_and_mixed_arrays
        value: {rtol: 1.0e-12, atol: 1.0e-14}
        scope: network_stage_only
      - id: vertical_mlse_kernel_checkpoint
        value: {abs: 2.0e-12}
        scope: isolated_MLSE_kernel_test_only
      - id: c4_metric_profile
        value: {relative: 0.01}
        scope: [COM_dB, ICN_mV, ERL]
    status: missing_for_required_com_compare
    gap: >-
      No observed tolerance is a valid substitute for a required COM/ERL/TD-ILN
      final metric policy plus checkpoint and stage alignment tolerances.

