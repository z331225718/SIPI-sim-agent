  "purpose": "P3C-02i statistical eye contour core: computes the Q-threshold contour of a statistical eye grid via statistical_eye_contour_v1 in sipi-com eye_contour_v1.rs: for each time column (strictly ascending time offsets in UI) with per-voltage-row Q-factors (strictly ascending voltage levels), locates the lower and upper voltage crossings where Q crosses the target Q (linear interpolation in Q between adjacent voltage rows, clamped at grid edges). Boundary of the statistical eye at the target BER-equivalent Q. Fail-closed: empty grids, column/row count mismatches, non-ascending time or voltage, non-finite or non-positive Q, a non-positive target Q, and any column without a Q >= target span are strictly rejected.",
