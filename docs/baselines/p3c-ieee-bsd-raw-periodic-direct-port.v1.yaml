policy:
  input_type: sipi_ieee_com_sparam::SelectedP3cUniformSpectrumV1
  one_sided_bin_requirement: at_least_two
  transform_length: two_times_one_sided_bin_count_minus_two
  hermitian_layout: real_dc_positive_interior_real_nyquist_conjugate_negative_interior
  endpoint_imaginary_residual:
    absolute_limit: 1.0e-12
    relative_limit: 1.0e-10
    scale: maximum_one_sided_complex_magnitude
    allowed_action: bounded_projection_to_real
  inverse:
    implementation: rustfft_6_4_1_inverse
    exponent_sign: positive
    normalization: one_over_n
    imaginary_residual:
      absolute_limit: 1.0e-12
      relative_limit: 1.0e-10
      scale: maximum_absolute_real_inverse_sample
  time_axis:
    sample_interval: one_over_n_times_frequency_step
    indices: half_open_zero_to_n_minus_one
    fftshift: prohibited
    time_shift: prohibited
    delay_removal: prohibited
    alignment: prohibited
  truncation: none_full_period_retained
  caller_overrides: prohibited
implementation:
  crate: crates/sipi-ieee-com-sparam
  rust_path: crates/sipi-ieee-com-sparam/src/s21_to_raw_periodic_v1.rs
