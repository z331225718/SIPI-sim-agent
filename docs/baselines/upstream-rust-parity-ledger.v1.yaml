schema: sipi.upstream-rust-parity-ledger.v1
status: active_open_before_rust_parity
as_of: '2026-08-22'
policy: sipi.upstream-capability-first-rust-consolidation.v1
state_machine:
  order: [source_admitted, branch_frozen, oracle_bound, direct_port_present, parity_observed, completion]
  pre_admission_state: source_identity_bound_pre_admission
  stage_statuses: [verified, blocked, not_started]
  transition_rule: contiguous_verified_prefix_then_blocked_or_not_started
  terminal_states: [rust_parity_accepted, retained_external_runtime, excluded_by_owner]
  open_completion_state: open
  rust_parity_acceptance_requires:
    - exact_source_blobs_and_per_path_license
    - reachable_branch_default_error_artifact_unknown_counts_zero
    - clean_pinned_two_fresh_oracle_runtime_attestation
    - pre_frozen_tolerance
    - candidate_source_hashes
    - direct_rust_route
    - direct_route_does_not_call_adapter
    - mutation_coverage
  non_parity_routes: [process_external_adapter, self_test, fixed_profile, generic_compare, similar_name_candidate]
source_authority:
  agent_spice: {commit: 2cc92316c2fb89a159f18fcb1ff2ba249f0e22f5, tree: b6bde97128030d6cea0d68b2f0a35d807be8c402, license: MIT}
  pybert: {commit: 5bf6d7ea0ace261891aaeb611ffc1c267e160afe, tree: 5faef6bdb341d444ad65d82a11c0018b15805e24, license: BSD-3-Clause}
  agent_com: {commit: 5272ffe74702cd585054d975559b06f8afae7b6e, tree: 7094ab6e84989b218730c52432c70da10261f8ea, license: MIT}
evidence_bindings:
  migration_inventory: {path: docs/baselines/upstream-migration-inventory.v1.yaml, sha256: 1d1a3fc2e43be26884554ca8a1d94217ade6142c0e1ae92a686eaba9b6ca5a86}
  candidate_coverage: {path: docs/baselines/upstream-rust-candidate-coverage.v1.yaml, sha256: 13ef9790bf620cee9031008daa963ed8a5faaa14f636984d0a2c92fb92bff765}
  cli_integration: {path: docs/baselines/upstream-cli-integration.v1.yaml, sha256: 567d853f375f535c1c3c5c2172b3486c1e49a57fc1b842b1ffe4028e0ec874ae}
  audit_document: {path: docs/baselines/audits/2026-08-22-upstream-rust-parity-ledger.md, sha256: f49f108c46cd28fd843e505be64577f0358372c132d88b5cf748b7a73b1128e9}
