adapter:
  crate: crates/sipi-pybert-adapter
  mode: process_external
  executable_is_caller_supplied: true
  numerical_code_copied: false
  fallback_policy: upstream_decision_must_be_reported
  default_policy: preserve_upstream_defaults_and_optional_arguments
  alignment_policy: no_adapter_alignment_or_resampling
  tolerance_policy: no_adapter_tolerance_or_acceptance_decision
  artifact_policy: fresh_target_then_pinned_minimum_regular_outputs_and_bounded_recursive_inventory_sha256_no_links
  cancellation_policy: caller_cancel_marker_or_deadline_kills_windows_job_or_nonwindows_direct_child
workflows:
  - id: PB-01
    public_command: sim
    cli_shape: [sim, CONFIG_FILE, optional(--results, RESULTS_FILE)]
    requested_backend: python
    input_load: PyBertCfg.load_from_file
    execution: PythonSimulationBackend -> PyBERT.simulate
    output: PyBERT pickle result; adapter resolves and hashes CONFIG_FILE with .pybert_data suffix when results is absent
    reachable_numeric_surface:
      channel: [default_Howard_Johnson_model, imported_S2P, termination_and_normalization, impulse_step_pulse]
      tx: [symbol_generation, TX_FFE, periodic_noise, random_noise, optional_IBIS_AMI]
      rx: [optional_CTLE, optional_RX_IBIS_AMI, optional_RX_FFE_DFE]
      equalization: [DFE, optional_Viterbi_FEC, optional_AMI_GetWave_or_Init]
      jitter: [crossing_times, data_dependent_and_spectral_jitter_paths]
      eye_ber: [time_eye, bathtub, BER_and_statistical_eye_when_configured]
      result: [PyBertData_pickle]
    external_dependencies:
      - numpy
      - scipy
      - scikit-rf
      - pyibis-ami
      - optional_IBIS_AMI_DLL_or_SO
      - optional_PyChOpMarg
    adapter_status: implemented_transport_only
    parity_status: not_evaluated
  - id: PB-02
    public_command: sim-native
    cli_shape: [sim-native, INPUT_FILE, --output-dir, OUTPUT_DIR]
    requested_backend: rust
    input_contract: NativeSimulationRequest accepts strict versioned JSON and optional contiguous float64 noise
    execution: RustSimulationBackend -> optional pybert-native extension
    output: meta.json plus arrays.npz
    reachable_numeric_surface:
      channel: [native_typed_channel_or_impulse_input]
      tx: [native_symbol_or_PRBS_input, optional_FFE]
      rx: [native_RX_filter_and_equalization]
      equalization: [native_DFE, optional_CDR_and_FEC]
      jitter: [native_crossing_and_jitter_helpers_when_requested]
      eye_ber: [native_eye_bathtub_and_BER_helpers_when_requested]
      result: [typed_native_result_arrays_and_metadata]
    external_dependencies:
      - optional_pybert_native_wheel
      - Rust_extension_implementation_at_runtime
    adapter_status: implemented_transport_only
    parity_status: not_evaluated
  - id: PB-03
    public_command: sim-rust
    cli_shape: [sim-rust, CONFIG_FILE, --output-dir, OUTPUT_DIR, optional(--statistical-time-points, N)]
    requested_backend: rust
    input_load: PyBertCfg.load_from_file
    projection: legacy_pybert_to_web_request
    execution: WebNativeSimulationBackend -> native Rust backend
    output: meta.json plus arrays.npz
    reachable_numeric_surface:
      channel: [default_or_S2P_channel, source_and_load_impedance, impulse_policy]
      tx: [pattern, TX_FFE, optional_TX_IBIS_AMI]
      rx: [CTLE, RX_FFE, optional_RX_IBIS_AMI]
      equalization: [DFE, CDR, optional_FEC]
      jitter: [configured_random_or_deterministic_jitter_and_CDR_observation]
      eye_ber: [sampled_eye, statistical_eye, BER]
      result: [native_result_arrays_and_metadata]
    external_dependencies:
      - optional_pybert_native_wheel
      - optional_IBIS_AMI_DLL_or_SO
      - web_request_schema_and_native_backend
    adapter_status: implemented_transport_only
    parity_status: not_evaluated
  - id: PB-04
    public_command: sim-auto
    cli_shape: [sim-auto, CONFIG_FILE, --output-dir, OUTPUT_DIR, optional(--statistical-time-points, N)]
    requested_backend: auto
    selection: native_validation_and_parity_gate_then_python_fallback
    failure_chain: [native_projection_or_validation_failure, parity_gate_reason, selected_python, native_runtime_failure_is_error_after_selection]
    output: meta.json plus arrays.npz; diagnostics.engine_selection is authoritative for selection
    reachable_numeric_surface:
      channel: [same_legacy_projection_or_native_path_as_sim-rust]
      tx: [same_legacy_projection_or_native_path_as_sim-rust]
      rx: [same_legacy_projection_or_native_path_as_sim-rust]
      equalization: [same_legacy_projection_or_native_path_as_sim-rust]
      jitter: [same_legacy_projection_or_native_path_as_sim-rust]
      eye_ber: [same_legacy_projection_or_native_path_as_sim-rust]
      result: [selected_backend_result_arrays_and_selection_diagnostics]
    external_dependencies:
      - optional_pybert_native_wheel
      - optional_IBIS_AMI_DLL_or_SO
      - Python_reference_dependencies_when_fallback_selected
    adapter_status: implemented_transport_and_selection_report
    parity_status: not_evaluated
  - id: PB-05
    public_command: sim-compare
    cli_shape: [sim-compare, CONFIG_FILE, --output-dir, OUTPUT_DIR, optional(--statistical-time-points, N)]
    requested_backend: compare
    execution: Python_reference_then_native_candidate_then_compare_backend_results
    candidate_failure_policy: comparison_report_passed_false_and_reference_artifact_is_retained
    output: meta.json plus arrays.npz carrying reference result and comparison diagnostics
    reachable_numeric_surface:
      channel: [Python_reference_channel_and_native_candidate_channel]
      tx: [Python_reference_TX_and_native_candidate_TX]
      rx: [Python_reference_RX_and_native_candidate_RX]
      equalization: [Python_reference_equalization_and_native_candidate_equalization]
      jitter: [Python_reference_jitter_and_native_candidate_jitter]
      eye_ber: [Python_reference_eye_BER_and_native_candidate_eye_BER]
      result: [structured_array_metadata_diagnostics_and_comparison_report]
    external_dependencies:
      - all_PB-01_reference_dependencies
      - all_PB-02_or_PB-03_native_dependencies
    adapter_status: implemented_transport_only
    parity_status: not_evaluated
operational_tracks_not_first_numeric_completion:
  - web_fastapi
  - redis_worker
  - desktop_gui
  - notebook_and_storage
non_claims:
  - This evidence does not claim Rust parity for any workflow.
  - This evidence does not import PyBERT source, fixtures, arrays, DLLs, or external paths.
  - This adapter does not implement channel, TX, RX, equalization, jitter, eye, BER, or comparison algorithms.
  - This adapter does not silently choose a backend; sim-auto selection is read from its published diagnostics.
  - This evidence does not close source license, external runtime, oracle, or release gates.
