  existing typed input-to-native-engine-to-typed-output path, the modulation
  and explicit equalizer branch tests, the Duo-binary decision-scaler
  correction, and the complete SimulationOutputV1 comparison gate.  It does
  not claim Python payload parity or close an external-model boundary.
