  status: pinned_rust_unit_corpus
  cases:
    - {id: quoted_include_lib, expectation: shlex_split_posix_false_path_tokens}
    - {id: valid_current_pwl_repeat, expectation: exact_ngspice_behavioral_rewrite_and_multiplicity}
    - {id: invalid_current_pwl_repeat_point, expectation: blocked_current_pwl_repeat_point_not_found}
    - {id: invalid_current_pwl_repeat_window, expectation: blocked_invalid_current_pwl_repeat_window}
    - {id: four_backends_alter_missing_end, expectation: all_backend_plans_ordered_alter_and_missing_end_preserved}
blockers:
  - Rust direct port is a partial admission candidate; it does not implement upstream file, artifact, process, or result branches.
  - The pinned differential corpus covers quoted tokenization, current-PWL converter leaves, four backend planning, ALTER, and missing-END only.
  - Rust native/netlist solver and backend process semantics are not implemented in the lane-local crate.
  - Native/ngspice/Xyce/XDM numeric outputs are oracle evidence only; no Rust comparison is claimed.
  - External solver artifacts are not retained under product custody.
  - Per-dependency third-party licenses and runtime authenticity remain outside the MIT source review.
  - Rust native/netlist solver and backend process semantics are not implemented in the lane-local crate.
