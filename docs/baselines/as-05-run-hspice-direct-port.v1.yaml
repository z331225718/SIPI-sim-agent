direct_port:
  crate: crates/sipi-agent-spice-direct
  crate_license: MIT
  upstream_commit_constant: 2cc92316c2fb89a159f18fcb1ff2ba249f0e22f5
  source_policy: lane_local_admission_model_only
  copied_upstream_source: false
  invokes_external_solver: false
  numerical_implementation: absent_by_design
  covered_semantics:
    - bounded_deck_string_admission_and_ordered_alter_split
    - quote_aware_shlex_posix_false_include_and_library_tokens
    - ngspice_current_pwl_repeat_rewrite_and_rejection_reasons
    - explicit_four_backend_prepare_and_execute_stage_plan
  missing_semantics:
    - file_read_source_hash_stable_source_path_and_case_artifact_writes
    - recursive_dependency_staging_and_missing_dependency_errors
    - compat_report_json_deck_case_output_measure_and_summary_schema
    - native_ngspice_xyce_and_xdm_process_execution_and_result_extraction
    - backend_failure_exit_codes_and_two_stage_xdm_artifact_lifecycle
    - included_netlist_current_pwl_rewrite_and_touchstone_preflight
    - runtime_source_attestation_and_external_solver_identity
branch_graph:
  input:
    read_deck_utf8: required
    source_sha256: recorded_before_case_split
    deck_id: path_stem
    split_alter_cases: [base_case, ordered_alter_cases, global_end_reappended_once, missing_end_preserved]
  preparation:
    audit: [directive_counts, include_paths, library_paths_and_sections, unsupported_directives]
    dependency_staging: [relative_under_source_root, absolute_not_staged, outside_source_root_reported]
    report: [deck_metadata, case_metadata, audit, outputs, actions, unsupported, summary]
    required_case_artifacts: [case.cir, case.source.sp, compat_report.json]
  backends:
    native:
      execute_false: [accept_hspice_syntax, preserve_deck_text, stage_dependencies]
      execute_true: [native_engine_resolution, optional_rfm_passthrough, dotnet_or_apphost_process, stdout_stderr_capture, native_result_and_waveform_summary]
      external_solver: native_agent_spice_engine
    ngspice:
      execute_false: [inc_to_include, probe_to_print, drop_option_post, stage_converted_dependencies]
      execute_true: [ngspice_batch_process, waveform_csv_extraction, measure_extraction, run_summary]
      external_solver: ngspice
    xyce:
      execute_false: [preserve_hspice_text, stage_dependencies]
      execute_true: [xyce_process, stdout_stderr_capture, run_summary, solver_owned_waveform_artifacts]
      external_solver: Xyce
    xyce_xdm:
      execute_false: [preserve_hspice_case_sp, prepare_case_cir]
      execute_true: [xdm_hspice_to_xyce, require_generated_case, xyce_process, per_stage_logs, two_stage_summary]
      external_solver: [xdm_bdl, Xyce]
  error_surfaces:
    - deck_read_os_error
    - unsupported_directive_reported_blocked
    - include_absolute_or_missing_or_escape_reported
    - backend_process_start_failure
    - backend_nonzero_exit
    - xdm_nonzero_exit_without_xyce_stage
    - xdm_missing_generated_case
    - xyce_nonzero_exit_after_successful_xdm
