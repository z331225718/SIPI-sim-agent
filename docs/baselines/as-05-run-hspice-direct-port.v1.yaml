    xyce: {exit: 0, cases: 3, required_files: [case.cir, case.source.sp, compat_report.json]}
    xyce_xdm: {exit: 0, cases: 3, required_files: [case.cir, case.source.sp, case.sp, compat_report.json]}
  execute:
    native: {exit: 0, cases: 3, observed_artifacts: [native_result.json, waveform.csv, run_summary.json, stdout.log, stderr.log]}
    ngspice: {exit: 0, cases: 3, observed_artifacts: [waveform.csv, run_summary.json, stdout.log, stderr.log]}
    xyce: {exit: 0, cases: 3, observed_artifacts: [case.cir.prn, run_summary.json, stdout.log, stderr.log]}
    xyce_xdm: {exit: 1, stopped_case: alter_corners__base, observed_artifacts: [case.sp, case.cir, xdm-out/case.sp, xdm.stdout.log, xdm.stderr.log, xyce.stdout.log, xyce.stderr.log, run_summary.json]}
  solver_availability_observation: [clean_archive_built_native_engine, ngspice_present, Xyce_present, xdm_bdl_present]
  artifact_retention: external_temp_only_not_retained_in_product_tree
  replay_tolerance:
    prepared_case_text: byte_exact
    compat_report: byte_exact_for_frozen_fixture
    branch_exit_code: exact_integer
    numeric_waveforms: not_frozen_until_rust_solver_port
