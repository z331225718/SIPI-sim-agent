  "purpose": "P4B-02 typed AMI parameter sub-slice: compares two assembled parameter profiles (BTreeMap<String, AmiParameterValueV1>, e.g. produced by 02b44 assembly) by typed value semantics via parameter_profiles_equivalent_v1 in sipi-ami-text parameter_profile_equivalence_v1.rs \u2014 the profile-map-level companion of 02b70 value equivalence, sitting above 02b47 profile diff which reports added/removed/changed by raw tokens. Every shared name must hold typed-equivalent values (02b70 rules: cross-type never equivalent, Float/Integer on parsed finite values, Boolean exact True/False, String raw bytes, List trimmed item sequences) and the name sets must match exactly. Fail-closed: names present in exactly one profile are reported as left_only/right_only, any typed value mismatch is reported per name with its reason; both-empty profiles are Equivalent; all lists in deterministic sorted order.",
