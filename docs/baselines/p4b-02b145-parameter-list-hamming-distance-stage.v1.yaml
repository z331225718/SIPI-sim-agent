{
  "schema": "sipi.p4b-02b145.parameter-list-hamming-distance-stage.v1",
  "status": "parameter_list_hamming_distance_ported",
  "purpose": "P4B-02 typed AMI parameter sub-slice: computes the Hamming distance of two validated List-typed AmiParameterValueV1 values under the P4B-02b1 list rule ((item, item, ...), items trimmed, non-empty) via list_hamming_distance_v1 in sipi-ami-text parameter_list_hamming_distance_v1.rs: returns the number of positions at which the two values' trimmed items differ (raw byte equality, per the P4B-02b0 raw-byte binding). This is the position-wise companion of 02b143 edit distance (the Hamming distance is an upper bound on the edit distance for equal-length sequences). Fail-closed: either value not declared List yields NotAList; either token not matching the List shape yields MalformedList (unreachable for values built via AmiParameterValueV1::try_new, kept defensive instead of panicking); differing item counts yield LengthMismatch (the Hamming distance is undefined without position alignment).",
