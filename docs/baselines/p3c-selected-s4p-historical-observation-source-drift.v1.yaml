  - {id: selected-raw-periodic-v1, evidence: docs/baselines/p3c-selected-s4p-raw-periodic-observation-evidence.v1.yaml, verifier: tools/verify_p3c_selected_s4p_raw_periodic_observation_evidence.py, expected_error: raw_periodic_product_source_drift}
  - {id: selected-bounded-causality-v1, evidence: docs/baselines/p3c-selected-s4p-causality-observation-evidence.v1.yaml, verifier: tools/verify_p3c_selected_s4p_causality_observation_evidence.py, expected_error: causality_product_source_drift}
