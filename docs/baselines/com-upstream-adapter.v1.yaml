schema: sipi.com-upstream-adapter.v1
status: adapter_implemented_parity_pending
purpose: strict_process_external_integration_of_pinned_agent_com_workflows
upstream:
  repository: https://github.com/z331225718/agent-com.git
  commit: 5272ffe74702cd585054d975559b06f8afae7b6e
  tree: 7094ab6e84989b218730c52432c70da10261f8ea
  declared_license: MIT
  license_scope: source_only_pending_per_path_review
  source_bytes_vendored: false
adapter:
  crate: crates/sipi-agent-com-adapter
  schema: sipi.agent-com.process-adapter.v1
  operations: [config_validate, run, compare, public_workflow]
  public_workflow_sequence: [load_config, run_com, write_artifacts]
  backend_mode: process_external_no_shell
  windows_process_containment:
    dependency: process-wrap
    version: 9.1.0
    registry_checksum: 2e842efad9119158434d193c6682e2ebee4b44d6ad801d7b349623b3f57cdf55
    declared_license: MIT OR Apache-2.0
    features: [std, job-object]
    spawn: suspended_before_job_assignment_then_resumed
    setup_failure: suspended_child_direct_kill_guard_fail_closed
    termination: job_object_kill_for_timeout_cancel_output_and_normal_drain
    drain: bounded_job_wait_and_pipe_join
    non_windows: bounded_direct_child_only
  working_directory:
    ownership: caller_owned
    validation: canonical_existing_directory_symlink_junction_fail_closed
    process_current_dir: enforced
    relative_request_paths: resolved_against_working_directory_before_transport
    relative_artifact_paths: resolved_against_working_directory_before_containment
  designated_output_boundary:
    output_dir: caller_selected_runtime_root
    log_file_and_progress_jsonl: must_be_descendants_of_output_dir
    filesystem_sandbox: false
    hostile_writer_custody: not_claimed
    freshness: not_claimed_overwrite_semantics_remain_upstream_owned
    cpu_memory_and_process_count_isolation: not_claimed
  public_workflow_profile_admission:
    omitted: pass_none_to_upstream_load_config
    named_preset: explicit_from_name
    custom: explicit_reader_required
    empty_profile_spec: rejected
  defaults: upstream_owned_omitted_when_not_explicit
  numerical_policy: upstream_owned_no_rewrite
  fallback: forbidden
  bounded_io:
    stdout: enforced
    stderr: enforced
    stdin: enforced_for_public_bridge
    wall_time: enforced
    cancellation: caller_owned_token
    argv_bytes: enforced_including_executable_fixed_args_and_final_command_args
    artifact_bytes: enforced_without_reading_artifact_payloads
    secondary_reap_deadline: enforced
    reader_and_stdin_join: bounded_secondary_deadline
    windows_termination: process_wrap_job_object_kill_and_bounded_drain
    output_root_and_ancestors: symlink_junction_fail_closed
    artifact_entries: regular_files_or_directories_only_with_hard_count_limit
  error_mapping:
    exit_2: usage
    exit_3: config_or_profile
    exit_4: touchstone_input
    exit_5: unsupported_path
    exit_6: convergence
    exit_8: internal
