  "purpose": "P3C-02h bathtub curve fit core: fits a polynomial curve to a V-shaped BER-vs-time bathtub in the log10(BER) domain via fit_bathtub_curve_v1 in sipi-com bathtub_fit_v1.rs: least-squares polynomial regression of degree 1..=3 over (time_offset_ui, log10(ber)) samples solved by Gaussian elimination with partial pivoting (deterministic). Returns fit coefficients, sample count, and maximum absolute residual at the sample points plus an evaluation method. Builds on the sample model of P3C-02f; the opening-width estimator remains in 02f. Fail-closed: too few samples, non-ascending time, invalid BER, invalid fit order, insufficient samples for the order, and a numerically degenerate system are strictly rejected.",
