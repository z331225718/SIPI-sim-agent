  "purpose": "P4B-02 typed AMI parameter sub-slice: produces the canonical form of an assembled parameter profile (BTreeMap<String, AmiParameterValueV1>, e.g. produced by 02b44 assembly) by applying canonicalize_parameter_value_spelling_v1 (02b75) to every entry via canonicalize_parameter_profile_v1 in sipi-ami-text parameter_profile_canonicalization_v1.rs: Integer spellings become the parsed i64 in decimal (007 -> 7), List spellings get trimmed items joined with \", \" ((a,b,c) -> (a, b, c)), and Boolean/Float/String stay raw. This is the profile-map-level companion of 02b75: a stable spelling key for a whole profile without float formatting. Fail-closed: canonical spellings are rebuilt through AmiParameterValueV1::try_new (always valid for canonical Integer/List forms); a defensive fallback keeps the original entry rather than panicking; the canonicalized count reports how many entries changed; canonicalization is idempotent.",
