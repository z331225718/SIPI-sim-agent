    non_claim: No model selector is embedded in the product library and no external asset is a product fixture.
  - id: dc-clamp-evaluator
    scope: finite strictly increasing typed I-V tables with linear in-domain interpolation and no extrapolation
    status: implemented_self_tested
    entry_points: [evaluate_dc_clamps_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-dc-clamp-evaluator.v1.md, crates/sipi-ibis/src/lib.rs::tests::rejects_invalid_tables_and_probe_domains_without_partial_output]
