entries:
  - id: selected-input-typ-static-dc-clamp
    scope: six fixed static probes for the selected external Input/TYP model ground-plus-power clamps
    status: external_profile_accepted
    entry_points: [decode_selected_dc_clamps_v1, evaluate_dc_clamps_v1]
    evidence_refs: [docs/baselines/p4a-ibis-input-typ-static-acceptance.v1.yaml, docs/baselines/p4a-ibis-input-typ-static-compare-evidence.v1.yaml]
    non_claim: This is DC-only evidence and does not certify C_comp transient behavior or general IBIS compatibility.
  - id: bounded-structural-parser
    scope: bounded ASCII physical lines comments bracketed keywords and opaque data tokens
    status: implemented_self_tested
    entry_points: [parse_structural_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-structural-parser-foundation.v1.md, crates/sipi-ibis/src/lib.rs::tests::rejects_encoding_nul_line_and_record_limit_failures]
    non_claim: Unknown keyword content remains structural and is not semantic IBIS support.
  - id: typed-semantic-envelope
    scope: lexical version component model declaration and block ownership only
    status: implemented_self_tested
    entry_points: [build_semantic_envelope_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-typed-semantic-envelope-foundation.v1.md, crates/sipi-ibis/src/lib.rs::tests::rejects_invalid_or_ambiguous_envelope_declarations]
    non_claim: The envelope does not validate a complete IBIS document.
  - id: selected-input-typ-decoder
    scope: one caller-selected Input Typical model with one C_comp and one ground and power clamp table
    status: implemented_self_tested
    entry_points: [decode_selected_dc_clamps_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-selected-dc-clamp-decoder.v1.md, crates/sipi-ibis/src/lib.rs::tests::rejects_duplicate_or_algorithmic_selected_profile_sections]
    non_claim: No model selector is embedded in the product library and no external asset is a product fixture.
  - id: dc-clamp-evaluator
    scope: finite strictly increasing typed I-V tables with linear in-domain interpolation and no extrapolation
    status: implemented_self_tested
    entry_points: [evaluate_dc_clamps_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-dc-clamp-evaluator.v1.md, crates/sipi-ibis/src/lib.rs::tests::rejects_invalid_tables_and_probe_domains_without_partial_output]
    non_claim: This primitive does not select PVT or solve a terminal network.
  - id: quasi-static-clamp-ccomp
    scope: memoryless typed clamp currents plus caller-supplied SIG-to-REF derivative through ideal C_comp
    status: implemented_self_tested
    entry_points: [evaluate_quasi_static_clamps_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-quasi-static-clamp-ccomp.v1.md, crates/sipi-ibis/src/lib.rs::tests::quasi_static_boundary_rejects_invalid_inputs_and_dc_domain_first]
    non_claim: This is not transient integration or external transient parity.
  - id: selected-differential-rc-load
    scope: fixed continuous P/N/REF 100 ohm plus per-leg 1 pF constitutive relation
    status: implemented_self_tested
    entry_points: [evaluate_selected_differential_rc_load_v1]
    evidence_refs: [docs/clean-room/specs/p4a-selected-differential-rc-load.v1.md, crates/sipi-rx-load/src/lib.rs::tests::common_mode_ramp_preserves_each_leg_capacitor_and_ref_current]
    non_claim: This is not a channel termination solve or an IBIS composition.
  - id: structural-inspect-stdin
    scope: one product-owned JSON UTF-8 text through bounded structural parse and typed envelope reporting
    status: implemented_self_tested
    entry_points: [IbisInspectServiceV1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-inspect-service.v1.md, crates/sipi-ibis/src/lib.rs::tests::inspect_service_reports_only_structural_and_envelope_facts, crates/sipi-cli/src/main.rs::tests::ibis_inspect_is_structural_only_and_rejects_other_ibis_commands]
