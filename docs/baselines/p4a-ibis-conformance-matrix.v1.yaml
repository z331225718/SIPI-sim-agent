    scope: memoryless typed clamp currents plus caller-supplied SIG-to-REF derivative through ideal C_comp
    status: implemented_self_tested
    entry_points: [evaluate_quasi_static_clamps_v1]
    evidence_refs: [docs/clean-room/specs/p4a-ibis-quasi-static-clamp-ccomp.v1.md, crates/sipi-ibis/src/lib.rs::tests::quasi_static_boundary_rejects_invalid_inputs_and_dc_domain_first]
    non_claim: This is not transient integration or external transient parity.
  - id: vt-table-core
    scope: finite strictly time-ascending typed V-T tables with linear in-domain interpolation and explicit out-of-domain rejection
    status: implemented_self_tested
    entry_points: [evaluate_vt_v1]
