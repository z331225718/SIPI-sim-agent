  "purpose": "P4B-02 typed AMI parameter sub-slice: computes a deterministic 64-bit fingerprint of the typed-form leaf content of an AmiParameterTreeV1 via fingerprint_parameter_tree_typed_leaves_v1 in sipi-ami-text parameter_tree_typed_leaf_fingerprint_v1.rs: walks every leaf, collects the canonical path -> (declared type token, raw value token) of every typed-form leaf (exactly two value tokens whose first token is a known type token Float/Integer/Boolean/String/List; value validity is not checked \u2014 the declared content is fingerprinted as-is), serializes the sorted map to compact JSON, and applies FNV-1a 64. This is the tree-level change detection fingerprint over declared typed content (paths, types, and raw values), the companion of 02b96 profile fingerprint; non-typed leaves are skipped and do not affect the hash. Fail-closed: the fingerprint is total (no error path); FNV-1a 64 uses wrapping arithmetic with the standard offset basis (14695981039346656037) and prime (1099511628211); a tree with no typed-form leaves hashes the empty object {}.",
