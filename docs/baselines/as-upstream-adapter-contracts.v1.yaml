commands:
  - id: AS-01
    cli: fit-sparam
    request_type: FitSparamRequest
    source_paths: [cli, sparam_fitting, sparam_target_fit, sparam_artifacts]
    positionals: [touchstone]
    options:
      - --output
      - --report
      - --html-report
      - --fitted-touchstone
      - --rfm
      - --rfm-wrapper
      - --report-top-rms
      - --log
      - --rms-target
      - --priority-band
      - --outside-band-weight
      - --passivity
      - --max-order
      - --min-order
      - --max-order-step
      - --quality-profile
      - --fail-on-quality
      - --allow-quality-warnings
      - --subckt-name
      - --tuning-profile
      - --pole-spacing
      - --fit-iterations
      - --hf-complex-pairs
      - --hf-pair-damping
      - --hf-pair-start-fraction
      - --passivity-max-iterations
      - --passivity-samples
      - --passivity-active-variables
    branches:
      - argument_parser_rejection
      - priority_band_or_full_band_target_selection
      - adaptive_order_search_and_native_fit
      - optional_passivity_check_or_enforcement
      - optional_quality_gate_failure
      - target_not_met_failure
      - artifact_export_and_success
    dependencies: [numpy, scipy, scikit-rf, cvxpy_for_optional_paths]
    assets: [input_touchstone_sNp, optional_tuning_profile, output_spice_rfm_touchstone_reports]
    upstream_error_surface: [ValueError, OSError, child_nonzero_exit]
    adapter_status: implemented_transport_only
    rust_status: candidate_present_parity_unbound
    parity_status: not_evaluated
  - id: AS-02
    cli: fit-sparam-cascade
    request_type: FitSparamCascadeRequest
    source_paths: [cli, sparam_cascade, sparam_fitting, sparam_artifacts]
    positionals: [manifest]
    options:
      - --output-root
      - --report
      - --rms-target
      - --max-order
      - --min-order
      - --max-order-step
      - --passivity-epsilon
      - --cascade-passivity-epsilon
      - --cascade-rms-target
      - --cascade-refit-iterations
      - --cascade-samples
      - --reference-impedance
      - --adjustment-iterations
      - --minimum-scale
      - --priority-band
      - --outside-band-weight
    branches:
      - argument_and_manifest_rejection
      - per_block_fit_and_order_search
      - shared_frequency_grid_and_cascade_evaluation
      - cascade_passivity_check
      - optional_targeted_refit
      - bounded_scale_adjustment
      - report_and_artifact_publication
    dependencies: [numpy, scipy, scikit-rf, cvxpy_for_passivity_paths]
    assets: [version_1_cascade_json, ordered_two_port_touchstones, output_root_reports_models]
    upstream_error_surface: [ValueError, OSError, JSON_decode_error, child_nonzero_exit]
    adapter_status: implemented_transport_only
    rust_status: candidate_present_parity_unbound
    parity_status: not_evaluated
  - id: AS-03
    cli: fit-yparam
    request_type: FitYparamRequest
    source_paths: [cli, sparam_yparam, sparam_target_fit, sparam_artifacts]
    positionals: [touchstone]
    options:
      - --output
      - --derived-s-touchstone
      - --report
      - --html-report
      - --log
      - --subckt-name
      - --n-poles-real
      - --n-poles-cmplx
      - --max-order
      - --order-step
      - --pole-spacing
      - --fit-iterations
      - --no-fit-proportional
      - --max-y-rms-siemens
      - --passivity
      - --passivity-epsilon
      - --conversion-condition-limit
      - --exact-s-rfm
      - --exact-s-touchstone
      - --exact-s-rfm-wrapper
      - --kyp-max-states
      - --kyp-margin
      - --kyp-max-relative-correction
      - --kyp-solver
    branches:
      - argument_and_touchstone_rejection
      - strict_s_to_y_conversion_condition_check
      - effective_order_search
      - positive_real_check_or_explicit_off
      - optional_exact_y_to_s_lft_and_kyp_path
      - output_report_and_optional_exports
    dependencies: [numpy, scipy, scikit-rf, cvxpy_optional_kyp]
    assets: [input_touchstone_sNp, optional_exact_outputs, output_y_spice_reports]
    upstream_error_surface: [ValueError, OSError, numerical_condition_failure, child_nonzero_exit]
    adapter_status: implemented_transport_only
    rust_status: candidate_present_parity_unbound
    parity_status: not_evaluated
  - id: AS-04
    cli: tune-yparam-tran
    request_type: TuneYparamTranRequest
    source_paths: [cli, sparam_y_tran_tuning, sparam_rfm, sparam_artifacts]
    positionals: [touchstone, input_rfm, deck]
    options:
      - --output-rfm
      - --report
      - --work-dir
      - --rfm-token
      - --rms-measure
      - --peak-measure
      - --residual-poles
      - --band-boundaries
      - --hspice-bin
      - --license-file
      - --max-evaluations
      - --max-static-rms-growth
      - --max-sigma
    branches:
      - strict_csv_and_monotonicity_rejection
      - exact_deck_token_and_measure_lookup
      - static_in_band_accuracy_gate
      - repeated_external_hspice_trial
      - bounded_optimizer_search
      - selected_candidate_write_and_report
    dependencies: [numpy, scipy, scikit-rf, hspice_runtime, license_endpoint]
    assets: [input_touchstone_sNp, input_y_derived_rfm, hspice_signoff_deck, hspice_measure_output]
    upstream_error_surface: [ValueError, OSError, subprocess_failure, missing_measurement, child_nonzero_exit]
    adapter_status: implemented_transport_only
    rust_status: candidate_present_parity_unbound
    parity_status: not_evaluated
  - id: AS-05
    cli: run-hspice
    request_type: RunHspiceRequest
    source_paths: [cli, hspice_alter, hspice_audit, hspice_converter, hspice_manifest, hspice_measure, hspice_results, backend_base, backend_native, backend_ngspice, backend_xyce, project, deck_builder, native_engine_manifest]
    positionals: [deck]
    options:
      - --backend
      - --output-root
      - --execute
      - --native-engine
      - --rfm
      - --rfm-subckt
      - --dotnet
    explicit_backend_values: [native, ngspice, xyce, xyce-xdm]
    branches:
      - deck_read_and_audit_rejection
      - alter_case_split_and_manifest
      - native_acceptance_and_optional_native_execution
      - ngspice_conversion_and_optional_execution
      - xyce_conversion_and_optional_execution
      - xyce_xdm_conversion_and_optional_execution
      - output_manifest_waveform_measurement_publication
    dependencies: [native_engine_or_dotnet, ngspice_optional, xyce_optional, xdm_optional, hspice_deck_assets]
    assets: [input_hspice_deck, include_files, probe_and_measure_outputs, optional_rfm_and_native_engine]
    upstream_error_surface: [ValueError, OSError, unsupported_deck, backend_process_failure, child_nonzero_exit]
    adapter_status: implemented_transport_with_explicit_backend
    rust_status: fixed_profile_candidate_only
    parity_status: profile_only_not_workflow_parity
  - id: AS-06
    cli: run-rfm
    request_type: RunRfmRequest
    source_paths: [cli, sparam_rfm, sparam_rfm_ngspice, hspice_audit, hspice_converter, hspice_results, backend_base, backend_native, backend_ngspice]
    positionals: [deck]
    options:
      - --rfm
      - --subckt-name
      - --output-root
      - --backend
      - --ngspice
      - --code-model
      - --native-engine
      - --dotnet
      - --execute
    explicit_backend_values: [native, ngspice]
    branches:
      - deck_and_rfm_parse_rejection
      - frequency_response_verification
      - native_nport_prepare_and_optional_execute
      - ngspice_xspice_wrapper_prepare_and_optional_execute
      - local_dependency_staging
      - waveform_and_summary_publication
    dependencies: [numpy, native_engine_or_dotnet, optional_ngspice, bundled_or_explicit_rfm_code_model]
    assets: [input_spice_deck, cadence_rfm, include_files, rfm_code_model, waveform_outputs]
    upstream_error_surface: [ValueError, OSError, RfmParseError, RfmNativeError, RfmNgspiceError, child_nonzero_exit]
    adapter_status: implemented_transport_with_explicit_backend
    rust_status: candidate_present_parity_unbound
    parity_status: not_evaluated
verification:
  repository_contract_gate: does_not_require_external_source_worktree
  exact_source_git_objects: checked_only_when_source_is_explicitly_supplied
  exact_source_smoke: ignored_external_runner_only
  numerical_parity: not_claimed
  license_reclassification: not_claimed_by_this_slice
  product_workspace_integration: pending_owner_gate
audit:
  path: docs/baselines/audits/2026-08-22-agent-spice-upstream-adapter.md
