schema: sipi.as-upstream-adapter-contracts.v1
status: adapter_implemented_parity_pending
policy: upstream_capability_first_then_rust_replacement
source:
  repository: agent-spice
  commit: 2cc92316c2fb89a159f18fcb1ff2ba249f0e22f5
  tree: b6bde97128030d6cea0d68b2f0a35d807be8c402
  module: agent_spice.cli
  license: MIT
  source_storage: external_git_object_only
  source_payload_copied_into_sipi: false
adapter:
  crate: crates/sipi-agent-spice-adapter
  request_enum: sipi_agent_spice_adapter::Request
  response_type: sipi_agent_spice_adapter::ExecutionResult
  launcher: [ "-m", "agent_spice.cli" ]
  launcher_policy: production_default_with_explicit_test_override
  argument_policy: caller_supplied_arguments_are_passed_through_without_rewrite
  backend_policy: run_commands_require_one_explicit_backend_argument
  defaults_policy: no_upstream_cli_default_is_injected_by_the_adapter
  fallback_policy: no_silent_fallback_or_backend_substitution
  process_limits:
    wall_time: caller_supplied_bounded_duration
    reader_drain_time: caller_supplied_secondary_deadline
    stdout_bytes: caller_supplied_bounded_integer
    stderr_bytes: caller_supplied_bounded_integer
    argv_bytes: caller_supplied_bounded_integer
    artifact_bytes: caller_supplied_bounded_integer
    artifact_files: caller_supplied_bounded_integer
    artifact_directories: caller_supplied_bounded_integer
    artifact_max_depth: caller_supplied_bounded_integer
    artifact_path_bytes: caller_supplied_bounded_integer
  cancellation: cooperative_token_kills_and_reaps_child
  process_tree_termination:
    windows:
      crate: process-wrap
      version: 9.1.0
      features: [std, job-object]
      license: MIT OR Apache-2.0
      lifecycle: child_created_suspended_then_assigned_to_job_before_resume
      termination: job_object_start_kill_covers_descendants_after_parent_exit
      normal_exit_cleanup: retained_job_is_terminated_before_result_publication
      setup_failure: process_isolation_failed_and_suspended_child_kill_attempted_without_raw_fallback
    non_windows: direct_child_kill_only_no_process_tree_claim
  output_admission:
    root: canonical_artifact_root
    required_explicit_outputs:
      AS-01: [--output]
      AS-02: [--output-root]
      AS-03: [--output]
      AS-04: [--output-rfm, --work-dir]
      AS-05: [--output-root]
      AS-06: [--output-root]
    optional_output_paths_are_also_checked: true
    relative_paths_resolve_from: canonical_working_directory
    missing_default_output_paths: rejected
    output_symlink_target: rejected_even_when_dangling
    symlink_parent: canonicalized_and_must_remain_inside_root
    target_preexistence: rejected_before_spawn
  post_success_required_artifacts:
    AS-01: { "--output": file }
    AS-02: { "--output-root": directory }
    AS-03: { "--output": file }
    AS-04: { "--output-rfm": file, "--work-dir": directory }
    AS-05: { "--output-root": directory }
    AS-06: { "--output-root": directory }
    enforcement: targeted_path_not_whole_root_inference
    checks: [exists, expected_file_or_directory_kind, not_symlink_or_windows_reparse_point, canonical_inside_artifact_root]
    applies_when: child_exit_code_zero
    failure_code: required_artifact_missing
  custody: post-run_regular_file_manifest_without_symlink_or_windows_reparse_traversal
  provenance:
    contract_source: agent-spice@2cc92316c2fb89a159f18fcb1ff2ba249f0e22f5
    source_commit: contract_source_commit_not_runtime_attestation
    source_identity: declared_migration_authority_not_authenticated_runtime_package
    runtime_identity: caller_supplied_unverified
    runtime_source_authenticated: false
    command: typed_request_command
    backend: parsed_from_exact_run_argv
    invocation_sha256: bounded_canonical_argument_hash
    artifact_manifest_sha256: bounded_canonical_manifest_hash
  parity_rule: this adapter is transport parity only; existing Rust candidates are not workflow parity
