  "purpose": "P3B-05e deterministic per-sample fractional time-warp shift core: applies a caller-supplied per-sample shift vector (sample units) to a sampled waveform by linear interpolation on the same grid. For output sample n, source position p = n + shift[n]; output is linear interpolation of the two nearest input samples (identity when integral). This is the deterministic time-warp basis on the P3B-05d injection waveform. Fail-closed: empty input, length mismatch, non-finite sample/shift, or interpolation stencil leaving [0, len-1] are hard errors; no zero-padding, wraparound, or extrapolation. The shift vector generator (jitter/time-warp model), units model, observables, and tolerance remain owner-decided and are NOT implemented here.",
