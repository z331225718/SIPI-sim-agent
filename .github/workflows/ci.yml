name: SIPI CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install workspace
        run: uv sync --locked
      - name: Regenerate packaged schema bundle
        run: uv run python -B tools/sync_contracts_schemas.py
      - name: Run unit test gate
        run: uv run python -B tools/run_all_tests.py

  clean-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Regenerate packaged schema bundle
        run: uv run python -B tools/sync_contracts_schemas.py
      - name: Run clean install smoke
        run: uv run python -B tools/clean_install_smoke.py

  agent-spice-wheel:
    name: Agent-Spice Windows x64 wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
      - name: Build and smoke-test the staged compatibility wheel
        run: uv run --no-project --python 3.12 python -B tools/verify_m5a_agent_spice_wheel.py

  sipi-ami:
    name: SIPI AMI clean-room Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path native/crates/sipi-ami/Cargo.toml --check
      - name: Run lints
        run: cargo clippy --manifest-path native/crates/sipi-ami/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --manifest-path native/crates/sipi-ami/Cargo.toml --locked
