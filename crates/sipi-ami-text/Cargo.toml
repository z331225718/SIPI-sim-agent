[package]
name = "sipi-ami-text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autotests = false
description = "Clean-room bounded structural parser foundation for AMI text."

[features]
default = []
p4b-self-crosscheck = []

[dependencies]
sha2 = "0.10"
serde_json = "1"

[[bin]]
name = "p4b_02b_crosscheck_runner"
path = "src/bin/p4b_02b_crosscheck_runner.rs"
test = false
bench = false
required-features = ["p4b-self-crosscheck"]

[[bin]]
name = "p4b_02_ami_parameter_subset_observer"
path = "src/bin/p4b_02_ami_parameter_subset_observer.rs"
test = false
bench = false

[lints]
workspace = true
