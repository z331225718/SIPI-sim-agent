[package]
name = "sipi-agent-com-direct"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Lane-local direct ports of the pinned Agent-COM compare, run, and public artifact boundaries."

[workspace]

[dependencies]
flate2 = "1"
quick-xml = "0.37"
sipi-channel = { path = "../sipi-channel" }
sipi-com = { path = "../sipi-com" }
sipi-types = { path = "../sipi-types" }
sipi-touchstone = { path = "../sipi-touchstone" }
same-file = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zip = "2"

[[bin]]
name = "sipi-com-direct-compare"
path = "src/bin/compare.rs"

[[bin]]
name = "sipi-com-direct-config-validate"
path = "src/bin/config_validate.rs"

[[bin]]
name = "sipi-com-direct-run"
path = "src/bin/run.rs"

[[bin]]
name = "sipi-com-direct-public-api"
path = "src/bin/public_api.rs"
