[package]
name = "sipi-agent-com-direct"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Lane-local direct port of the pinned Agent-COM result comparator."

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sipi-com-direct-compare"
path = "src/bin/compare.rs"
