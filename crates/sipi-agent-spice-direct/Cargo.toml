[package]
name = "sipi-agent-spice-direct"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
publish = false
description = "Lane-local Agent-Spice direct-port admission model."

[workspace]

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
num-complex = "0.4"
sha2 = "0.10"
serde_json = "1"
serde_yaml = "0.9"
same-file = "1.0"
sipi-channel = { path = "../sipi-channel" }
sipi-types = { path = "../sipi-types" }

[lints.rust]
unsafe_code = "forbid"
