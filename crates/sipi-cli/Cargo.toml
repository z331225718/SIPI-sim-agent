[package]
name = "sipi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Unsupported-only SIPI CLI foundation."
autotests = false
default-run = "sipi"

[features]
test-support = []
# Internal-only link check for the quarantined Agent-COM direct port.  This is
# deliberately non-default and does not publish a `sipi com run` command.
com-direct-integration = ["dep:sipi-agent-com-direct"]
# Internal-only root linkage for the quarantined Agent-Spice direct leaves.
# The feature stays opt-in so the default CLI remains byte-for-byte isolated
# from the direct port and its external-runtime custody paths.
agent-spice-direct-integration = ["dep:sipi-agent-spice-direct", "dep:serde"]

[[bin]]
name = "sipi"
path = "src/main.rs"

[[bin]]
name = "sipi-upstream-fake"
path = "src/bin/upstream_fake.rs"
test = false
bench = false
required-features = ["test-support"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "p6_current_topology"
path = "tests/p6_current_topology.rs"

[[test]]
name = "upstream_migration"
path = "tests/upstream_migration.rs"
required-features = ["test-support"]

[dependencies]
sipi-agent-com-adapter = { path = "../sipi-agent-com-adapter" }
sipi-agent-com-direct = { path = "../sipi-agent-com-direct", optional = true }
sipi-agent-spice-direct = { path = "../sipi-agent-spice-direct", optional = true }
sipi-agent-spice-adapter = { path = "../sipi-agent-spice-adapter" }
sipi-artifacts = { path = "../sipi-artifacts" }
sipi-channel = { path = "../sipi-channel" }
sipi-com = { path = "../sipi-com" }
sipi-compare = { path = "../sipi-compare" }
sipi-contracts = { path = "../sipi-contracts" }
sipi-ibis = { path = "../sipi-ibis" }
sipi-link = { path = "../sipi-link" }
sipi-pipeline = { path = "../sipi-pipeline" }
sipi-pybert-adapter = { path = "../sipi-pybert-adapter" }
sipi-runtime = { path = "../sipi-runtime" }
sipi-rx-load = { path = "../sipi-rx-load" }
sipi-tran = { path = "../sipi-tran" }
sipi-touchstone = { path = "../sipi-touchstone" }
sipi-types = { path = "../sipi-types" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"

[lints]
workspace = true
