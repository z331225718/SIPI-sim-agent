[package]
name = "sipi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Unsupported-only SIPI CLI foundation."
autotests = false
default-run = "sipi"

[features]
test-support = []
# Opt-in scoped public `sipi com run` route for the Agent-COM direct port.
# It remains absent from the default CLI build.
com-direct-integration = ["dep:sipi-agent-com-direct"]
# Diagnostic-only raw normal-ERL sidecar. It is deliberately opt-in and
# forwards only through the already opt-in public COM route.
normal-erl-diagnostic-sidecar = ["com-direct-integration", "sipi-agent-com-direct/normal-erl-diagnostic-sidecar"]
# Internal-only root linkage for the quarantined Agent-Spice direct leaves.
# The feature stays opt-in so the default CLI remains byte-for-byte isolated
# from the direct port and its external-runtime custody paths.
agent-spice-direct-integration = ["dep:sipi-agent-spice-direct"]
# Local candidate linkage only; the PyBERT crate retains its independent
# source/license review boundary and is not admitted to release composition.
pybert-direct-integration = ["dep:sipi-pybert-direct"]

[[bin]]
name = "sipi"
path = "src/main.rs"

[[bin]]
name = "sipi-upstream-fake"
path = "src/bin/upstream_fake.rs"
test = false
bench = false
required-features = ["test-support"]

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "p6_current_topology"
path = "tests/p6_current_topology.rs"

[[test]]
name = "upstream_migration"
path = "tests/upstream_migration.rs"
required-features = ["test-support"]

[[test]]
name = "channel_native"
path = "tests/channel_native.rs"

[dependencies]
sipi-ami-host = { path = "../sipi-ami-host" }
sipi-ami-text = { path = "../sipi-ami-text" }
sipi-ami-worker = { path = "../sipi-ami-worker" }
sipi-agent-com-adapter = { path = "../sipi-agent-com-adapter" }
sipi-agent-com-direct = { path = "../sipi-agent-com-direct", optional = true }
sipi-agent-spice-direct = { path = "../sipi-agent-spice-direct", optional = true }
sipi-agent-spice-adapter = { path = "../sipi-agent-spice-adapter" }
sipi-artifacts = { path = "../sipi-artifacts" }
sipi-channel = { path = "../sipi-channel" }
sipi-com = { path = "../sipi-com" }
sipi-compare = { path = "../sipi-compare" }
sipi-contracts = { path = "../sipi-contracts" }
sipi-ibis = { path = "../sipi-ibis" }
sipi-link = { path = "../sipi-link" }
sipi-pipeline = { path = "../sipi-pipeline" }
sipi-pybert-adapter = { path = "../sipi-pybert-adapter" }
sipi-pybert-direct = { path = "../sipi-pybert-direct", optional = true }
sipi-runtime = { path = "../sipi-runtime" }
sipi-rx-load = { path = "../sipi-rx-load" }
sipi-tran = { path = "../sipi-tran" }
sipi-touchstone = { path = "../sipi-touchstone" }
sipi-types = { path = "../sipi-types" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"

[lints]
workspace = true
