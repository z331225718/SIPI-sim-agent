[package]
name = "sipi-pybert-direct"
version = "0.1.0"
edition = "2024"
license-file = "NOTICE-PYBERT-LICENSE-BOUNDARY.md"
rust-version = "1.97"
publish = false
description = "Lane-local direct port of the pinned PyBERT native Rust core and sim-native artifact boundary."

[dependencies]
flate2 = "1.1"
getrandom = "0.2"
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-pickle = "1.2"
serde_yaml = "0.9"
sha2 = "0.10"
rustfft = "6.4"
same-file = "1.0"
statrs = "0.18"
thiserror = "2.0"
yaml-rust2 = { version = "0.10", default-features = false }
sipi-ami-worker = { path = "../sipi-ami-worker" }
sipi-ami-text = { path = "../sipi-ami-text" }
sipi-artifacts = { path = "../sipi-artifacts" }

[[bin]]
name = "sipi-pybert-direct"
path = "src/bin/sipi-pybert-direct.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Preserve the pinned core's public stage signature without rewriting its
# direct-port source merely to satisfy a style lint.
too_many_arguments = "allow"

# Deliberately independent from the product workspace until the direct-port
# review accepts its source, license, artifact, and parity boundaries.
[workspace]
