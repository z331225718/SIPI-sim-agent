[package]
name = "sipi-pybert-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Bounded process-external adapter for the pinned PyBERT CLI workflows."
autotests = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=9.1.0", default-features = false, features = ["std", "job-object"] }

[lints]
workspace = true

[[bin]]
name = "pb_fake_pybert"
path = "src/bin/pb_fake_pybert.rs"
required-features = ["test-support"]

[[test]]
name = "process"
path = "tests/process.rs"
required-features = ["test-support"]
