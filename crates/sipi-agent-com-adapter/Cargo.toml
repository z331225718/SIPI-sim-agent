[package]
name = "sipi-agent-com-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Strict process-external adapter for the pinned Agent-COM workflows."
autotests = false

[features]
test-support = []

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=9.1.0", default-features = false, features = ["std", "job-object"] }

[[bin]]
name = "fake-com-backend"
path = "src/bin/fake_com_backend.rs"
required-features = ["test-support"]

[[test]]
name = "adapter_contract"
path = "tests/adapter_contract.rs"
required-features = ["test-support"]

[[test]]
name = "exact_upstream_smoke"
path = "tests/exact_upstream_smoke.rs"
