[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sipi-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sipi-contracts", "sipi-adapters"]
[tool.uv.sources]
sipi-contracts = { workspace = true }
sipi-adapters = { workspace = true }
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
