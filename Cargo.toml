[workspace]
members = [
  "crates/sipi-cli",
  "crates/sipi-agent-com-adapter",
  "crates/sipi-agent-spice-adapter",
  "crates/sipi-pybert-adapter",
  "crates/sipi-channel",
  "crates/sipi-com",
  "crates/sipi-compare",
  "crates/sipi-ibis",
  "crates/sipi-ieee-com-sparam",
  "crates/sipi-artifacts",
  "crates/sipi-ami-text",
  "crates/sipi-ami-host",
  "crates/sipi-ami-worker",
  "crates/sipi-contracts",
  "crates/sipi-layout",
  "crates/sipi-link",
  "crates/sipi-pipeline",
  "crates/sipi-p3c",
  "crates/sipi-runtime",
  "crates/sipi-rx-load",
  "crates/sipi-touchstone",
  "crates/sipi-tran",
  "crates/sipi-types",
]
default-members = ["crates/sipi-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
