[workspace]
members = [
  "crates/sipi-cli",
  "crates/sipi-artifacts",
  "crates/sipi-contracts",
  "crates/sipi-layout",
  "crates/sipi-pipeline",
  "crates/sipi-runtime",
  "crates/sipi-tran",
  "crates/sipi-types",
]
default-members = ["crates/sipi-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
