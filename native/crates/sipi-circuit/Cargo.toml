[package]
name = "agent-spice-sim"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Project-owned sparse PI/SI circuit simulator"
build = "build.rs"

[lib]
name = "agent_spice_sim"
path = "src/lib.rs"

[[bin]]
name = "agent-spice-sim"
path = "src/main.rs"

[dependencies]
faer = "0.24.4"
num-complex = "0.4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
vecfit = "0.1.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
