name: Rust checks

on:
  pull_request:
    paths:
      - "native/agent-spice-sim/**"
      - "tests/test_rust_engine.py"
      - "tests/fixtures/hspice/**"
      - "native/AgentSpice.Engine/fixtures/**"
      - ".github/workflows/rust-checks.yml"
  push:
    branches: [main]
    paths:
      - "native/agent-spice-sim/**"
      - "tests/test_rust_engine.py"
      - "tests/fixtures/hspice/**"
      - "native/AgentSpice.Engine/fixtures/**"
      - ".github/workflows/rust-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --manifest-path native/agent-spice-sim/Cargo.toml --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: clippy
      - run: cargo clippy --manifest-path native/agent-spice-sim/Cargo.toml --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
      - run: cargo test --manifest-path native/agent-spice-sim/Cargo.toml --locked

  rust-oracle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
      - run: cargo build --manifest-path native/agent-spice-sim/Cargo.toml --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pytest
      - run: python -m pytest tests/test_rust_engine.py -rs -q
