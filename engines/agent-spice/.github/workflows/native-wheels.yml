name: Native wheels

on:
  pull_request:
    paths:
      - ".github/workflows/native-wheels.yml"
      - "native/**"
      - "src/agent_spice/backend/native.py"
      - "setup.py"
      - "pyproject.toml"
      - "tools/build-native-*.ps1"
      - "tools/build-rust-engine.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-wheels.yml"
      - "native/**"
      - "src/agent_spice/backend/native.py"
      - "setup.py"
      - "pyproject.toml"
      - "tools/build-native-*.ps1"
      - "tools/build-rust-engine.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: agent-spice-sim.exe
            rust-target: ""
          - os: ubuntu-latest
            rid: linux-x64
            executable: agent-spice-sim
            rust-target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            rid: osx-x64
            executable: agent-spice-sim
            rust-target: ""
          - os: macos-15
            rid: osx-arm64
            executable: agent-spice-sim
            rust-target: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install static Linux target
        if: matrix.rust-target != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add "${{ matrix.rust-target }}"
      - name: Build platform wheel
        shell: pwsh
        run: |
          $parameters = @{ RuntimeIdentifier = "${{ matrix.rid }}" }
          if ("${{ matrix.rust-target }}") {
              $parameters.RustTarget = "${{ matrix.rust-target }}"
          }
          ./tools/build-native-wheel.ps1 @parameters
      - name: Verify static Linux executable
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          description=$(file src/agent_spice/lib/native/linux-x64/agent-spice-sim)
          echo "$description"
          grep --extended-regexp --quiet 'statically linked|static-pie linked' <<< "$description"
      - name: Install wheel without runtime dependencies
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          python -m pip install --no-deps $wheel.FullName
      - name: Smoke packaged Rust executable
        shell: pwsh
        run: |
          $packageRoot = python -c "import agent_spice, pathlib; print(pathlib.Path(agent_spice.__file__).parent)"
          $engine = Join-Path $packageRoot "lib/native/${{ matrix.rid }}/${{ matrix.executable }}"
          & $engine native/AgentSpice.Engine/fixtures/rc.cir --output-json native-smoke.json
          if ($LASTEXITCODE -ne 0) {
              throw "Rust engine smoke failed with exit code $LASTEXITCODE"
          }
          $result = Get-Content -LiteralPath native-smoke.json -Raw | ConvertFrom-Json
          if ($result.points.Count -ne 8) {
              throw "unexpected simulation point count: $($result.points.Count)"
          }
      - name: Verify packaged provenance and write promotion manifest
        shell: pwsh
        run: |
          $packageRoot = python -c "import agent_spice, pathlib; print(pathlib.Path(agent_spice.__file__).parent)"
          $engine = Join-Path $packageRoot "lib/native/${{ matrix.rid }}/${{ matrix.executable }}"
          $buildInfo = (& $engine build-info --json | ConvertFrom-Json)
          if ($buildInfo.schema -ne "agent-spice.build-info.v1") {
              throw "unexpected build-info schema: $($buildInfo.schema)"
          }
          if ($buildInfo.gitRevision -ne $env:GITHUB_SHA -or $buildInfo.gitDirty -ne $false) {
              throw "packaged executable does not identify the checked-out clean revision"
          }
          if ($buildInfo.profile -ne "release" -or [string]::IsNullOrWhiteSpace($buildInfo.target)) {
              throw "packaged executable has incomplete release provenance"
          }
          $responseBin = Join-Path $PWD "rfm-response.bin"
          $metadataJson = Join-Path $PWD "rfm-response.json"
          & $engine rfm-response native/AgentSpice.Engine/fixtures/one_port.rfm --fft-size 8 --dt 1e-12 --response-bin $responseBin --metadata-json $metadataJson
          if ($LASTEXITCODE -ne 0) {
              throw "RFM provenance smoke failed with exit code $LASTEXITCODE"
          }
          $producer = (Get-Content -LiteralPath $metadataJson -Raw | ConvertFrom-Json).producer
          if (($producer | ConvertTo-Json -Compress) -ne ($buildInfo | ConvertTo-Json -Compress)) {
              throw "rfm-response producer does not match build-info"
          }
          $wheel = Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1
          $manifest = [ordered]@{
              schema = "agent-spice.promotion-manifest.v1"
              repository = $env:GITHUB_REPOSITORY
              workflow = ".github/workflows/native-wheels.yml"
              runId = [int64]$env:GITHUB_RUN_ID
              commit = $env:GITHUB_SHA
              rid = "${{ matrix.rid }}"
              artifactName = "agent-spice-${{ matrix.rid }}"
              buildInfo = $buildInfo
              executableName = "${{ matrix.executable }}"
              executableSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $engine).Hash.ToLowerInvariant()
              wheelName = $wheel.Name
              wheelSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "agent-spice-promotion-${{ matrix.rid }}.json" -Encoding utf8
      - id: upload-promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-spice-${{ matrix.rid }}
          path: |
            dist/*.whl
            agent-spice-promotion-${{ matrix.rid }}.json
          if-no-files-found: error

  promotion-index:
    name: Promotion index
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-spice-*
          path: promotion-artifacts
      - name: Validate manifests and write index
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected_rids = {"win-x64", "linux-x64", "osx-x64", "osx-arm64"}
          manifests = sorted(Path("promotion-artifacts").rglob("agent-spice-promotion-*.json"))
          if len(manifests) != len(expected_rids):
              raise SystemExit("missing or duplicate platform promotion manifests")
          entries = []
          for path in manifests:
              content = path.read_bytes()
              manifest = json.loads(content)
              if manifest.get("schema") != "agent-spice.promotion-manifest.v1":
                  raise SystemExit(f"unexpected manifest schema: {path}")
              if manifest.get("repository") != os.environ["EXPECTED_REPOSITORY"]:
                  raise SystemExit(f"unexpected source repository: {path}")
              if manifest.get("workflow") != ".github/workflows/native-wheels.yml":
                  raise SystemExit(f"unexpected source workflow: {path}")
              if manifest.get("runId") != int(os.environ["EXPECTED_RUN_ID"]):
                  raise SystemExit(f"unexpected source run: {path}")
              if manifest.get("commit") != os.environ["EXPECTED_COMMIT"]:
                  raise SystemExit(f"unexpected source commit: {path}")
              if manifest.get("rid") not in expected_rids:
                  raise SystemExit(f"unexpected platform RID: {path}")
              expected_rids.remove(manifest["rid"])
              entries.append({
                  "rid": manifest["rid"],
                  "artifactName": manifest["artifactName"],
                  "manifestSha256": hashlib.sha256(content).hexdigest(),
                  "wheelSha256": manifest["wheelSha256"],
                  "executableSha256": manifest["executableSha256"],
              })
          if expected_rids:
              raise SystemExit(f"missing platform RIDs: {sorted(expected_rids)}")
          index = {
              "schema": "agent-spice.promotion-index.v1",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "workflow": ".github/workflows/native-wheels.yml",
              "runId": int(os.environ["EXPECTED_RUN_ID"]),
              "commit": os.environ["EXPECTED_COMMIT"],
              "artifacts": sorted(entries, key=lambda entry: entry["rid"]),
          }
          Path("agent-spice-promotion-index.json").write_text(
              json.dumps(index, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-spice-promotion-index
          path: agent-spice-promotion-index.json
          if-no-files-found: error
